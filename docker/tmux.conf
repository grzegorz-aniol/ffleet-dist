# Forge Fleet tmux defaults.
#
# Read automatically by the tmux server on start (before ~/.tmux.conf). These
# make rendering correct when attaching over `docker exec -it ... tmux attach`,
# so no per-session flags are needed.

# TERM programs inside tmux see. tmux-256color adds italics + modified function
# keys over screen-256color; provided by the ncurses-term package (installed in
# the image).
set -g default-terminal "tmux-256color"

# Advertise truecolor (24-bit RGB) to capable host terminals.
set -as terminal-overrides ",*:Tc"

# Let Claude Code's OSC passthrough sequences (window title, desktop
# notifications, progress) reach the outer terminal instead of being swallowed.
set -g allow-passthrough on

# Distinguish Shift+Enter and other modified keys (Claude Code uses these).
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Mouse wheel scrolling / selection.
set -g mouse on

# If dashed separators or box-drawing still render as garbage on a particular
# host terminal, uncomment to force ACS line-drawing instead of UTF-8:
# set -as terminal-overrides ",*:U8=0"
